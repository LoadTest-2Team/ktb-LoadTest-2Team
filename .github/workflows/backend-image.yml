name: Backend image to S3

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/deploy/config.json"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: main
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build backend image tar
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          tags: backend:latest
          outputs: type=docker,dest=/tmp/backend.tar
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Upload backend image to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 cp "/tmp/backend.tar" \
            "s3://${S3_BUCKET}/static/main/docker-images/backend.tar" \
            --only-show-errors
      - name: Upload config.json to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 cp "apps/deploy/config.json" \
            "s3://${S3_BUCKET}/static/main/config.json" \
            --only-show-errors

      - name: Package CloudWatch Agent configuration
        run: |
          tar -cf /tmp/cloudwatch-backend.tar \
            -C apps/backend/monitoring/cloudwatch \
            install-cloudwatch-agent.sh \
            cloudwatch-agent-backend.json \
            prometheus.yaml \
            common-config.toml

      - name: Upload CloudWatch Agent configuration
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 cp /tmp/cloudwatch-backend.tar \
            "s3://${S3_BUCKET}/static/main/monitoring/cloudwatch-backend.tar" \
            --only-show-errors