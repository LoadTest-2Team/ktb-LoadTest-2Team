groups:
  - name: ktb_application_sli
    interval: 30s
    rules:
      - record: ktb:http_success_latency_seconds:avg5m
        expr: |
          sum by (application) (rate(http_server_success_latency_seconds_sum[5m]))
          /
          clamp_min(sum by (application) (rate(http_server_success_latency_seconds_count[5m])), 1e-9)

      # CloudWatch Agent cannot ingest histograms. These are the conservative
      # maximum of the client-side per-instance summary quantiles.
      - record: ktb:http_success_latency_seconds:p95
        expr: max by (application) (http_server_success_latency_seconds{quantile="0.95"})

      - record: ktb:http_success_latency_seconds:p99
        expr: max by (application) (http_server_success_latency_seconds{quantile="0.99"})

      - record: ktb:http_error_responses_per_second:rate5m
        expr: sum by (application, status_class) (rate(http_server_responses_total[5m]))

      - record: ktb:http_slo_exceeded:ratio5m
        expr: |
          sum by (application) (rate(http_server_success_slo_exceeded_total[5m]))
          /
          clamp_min(sum by (application) (rate(http_server_success_latency_seconds_count[5m])), 1e-9)

      - record: ktb:tomcat_thread_pool_utilization:ratio
        expr: |
          tomcat_threads_busy_threads
          /
          clamp_min(tomcat_threads_config_max_threads, 1)

  - name: container_name_mapping
    interval: 30s
    rules:
      # Map container IDs to friendly names using regex replacement
      - record: container_cpu_usage_rate
        expr: |
          label_replace(
            label_replace(
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      label_replace(
                        rate(container_cpu_usage_seconds_total{id=~"/docker/.*"}[5m]) * 100,
                        "container_name", "mongo", "id", "/docker/d9a6c186f7fa.*"
                      ),
                      "container_name", "redis", "id", "/docker/9d6acaeed099.*"
                    ),
                    "container_name", "prometheus", "id", "/docker/20ba7b848e34.*"
                  ),
                  "container_name", "grafana", "id", "/docker/cc0b48014415.*"
                ),
                "container_name", "mongodb-exporter", "id", "/docker/69d367ecf426.*"
              ),
              "container_name", "redis-exporter", "id", "/docker/aa3a2657c7fd.*"
            ),
            "container_name", "cadvisor", "id", "/docker/d06607df3fed.*"
          )

      # Memory metrics with container names
      - record: container_memory_usage_bytes
        expr: |
          label_replace(
            label_replace(
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      label_replace(
                        container_memory_working_set_bytes{id=~"/docker/.*"},
